server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Use Docker's internal resolver (127.0.0.11) so nginx does NOT try to
    # resolve the upstream hostname at startup — it resolves on each request.
    # This prevents the container from crashing when the api service is
    # temporarily absent or starting up after this container.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy /api/* to the API server container named "api" on port 8080.
    # If your Coolify service is named differently, set API_UPSTREAM to
    # match (e.g. http://jarvis-api:8080).  The default covers Docker
    # Compose / Coolify projects where the API service is named "api".
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass        $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Long-running SSE streams need extended timeouts
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 5s;

        # Return a clean JSON error when the API is unreachable
        # rather than an nginx HTML error page
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"API service unavailable","status":503}';
    }

    location / {
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
